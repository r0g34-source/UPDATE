<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Enkapta App · Crear cuenta</title>
  
  <link rel="icon" type="image/png" href="assets/replica/logo-enkapta.png">

  <style>
    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
      color: #111827;
      overflow: hidden;
      user-select: none;
    }

    input {
      user-select: auto;
    }

    /* Scrollbars hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Responsive Shell: 390px on Desktop, 100% on Mobile */
    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-viewport {
      width: 390px;
      height: 844px;
      max-width: 100%;
      max-height: 96vh;
      background-color: #FF7900;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 42px;
      border: 8px solid #1e293b;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
      min-width: 0;
    }

    @media (max-width: 449px) {
      body {
        background-color: #FF7900;
        display: block;
      }
      .app-viewport {
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    /* 1. Android Status Bar (White icons on Orange) */
    .status-bar {
      height: 32px;
      background: #FF7900;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      flex-shrink: 0;
      z-index: 40;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }

    /* 2. Top Header */
    .top-header {
      height: 52px;
      background: #FF7900;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      position: relative;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      text-decoration: none;
    }

    .header-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.3px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .step-badge {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 9999px;
      letter-spacing: 0.3px;
    }

    /* 3. White Sheet Body */
    .sheet-body {
      flex: 1;
      background: #ffffff;
      border-radius: 26px 26px 0 0;
      padding: 22px 20px 88px 20px; /* 88px bottom padding for sticky button */
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .subtitle-text {
      text-align: center;
      font-size: 13.5px;
      color: #475569;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    /* Social Auth Buttons */
    .social-btn {
      width: 100%;
      height: 48px;
      min-height: 48px;
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14.5px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .social-btn:active {
      background-color: #f8fafc;
      transform: scale(0.98);
    }

    /* Divider "o" */
    .divider-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0 16px 0;
      position: relative;
      flex-shrink: 0;
    }

    .divider-line {
      width: 100%;
      height: 1px;
      background: #f1f5f9;
    }

    .divider-text {
      position: absolute;
      background: #ffffff;
      padding: 0 10px;
      font-size: 12px;
      color: #94a3b8;
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
      flex-shrink: 0;
    }

    .form-label {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }

    .input-field {
      width: 100%;
      height: 48px;
      background: #fcfdfe;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-field:focus {
      border-color: #FF7900;
      box-shadow: 0 0 0 2px rgba(255, 121, 0, 0.15);
    }

    .input-field::placeholder {
      color: #94a3b8;
    }

    /* Dropdown field */
    .dropdown-field {
      width: 100%;
      height: 48px;
      background: #fcfdfe;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: #94a3b8;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .dropdown-field:active {
      border-color: #FF7900;
    }

    /* Password field with eye */
    .password-wrapper {
      width: 100%;
      height: 48px;
      background: #fcfdfe;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 14px 0 16px;
      gap: 10px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .password-wrapper:focus-within {
      border-color: #FF7900;
      box-shadow: 0 0 0 2px rgba(255, 121, 0, 0.15);
    }

    .password-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14px;
      color: #0f172a;
      min-width: 0;
    }

    .password-input::placeholder {
      color: #94a3b8;
    }

    .eye-btn {
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
    }

    /* Forgot Password */
    .forgot-pass-link {
      color: #c25700;
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      margin: 14px 0 20px 0;
      display: block;
      cursor: pointer;
    }

    /* 4. Sticky Bottom Action Bar */
    .bottom-action-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      padding: 10px 18px 8px 18px;
      border-top: 1px solid #f8fafc;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: #FF7900;
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(255, 121, 0, 0.35);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .btn-submit:active {
      background: #e66d00;
      transform: scale(0.98);
    }

    .android-indicator {
      width: 90px;
      height: 3px;
      background: #cbd5e1;
      border-radius: 9999px;
      margin: 2px auto 0 auto;
    }
  </style>
</head>
<body>

  <!-- MOBILE PHONE VIEWPORT -->
  <div class="app-viewport">

    <!-- 1. ANDROID STATUS BAR (12:29 | Wifi | 13%) -->
    <div class="status-bar">
      <!-- Left: 12:29 + icons -->
      <div class="status-left">
        <span>12:29</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="7" y1="12" x2="17" y2="12"></line>
        </svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </div>

      <!-- Right: Wifi, Signal, Battery 13% -->
      <div class="status-right">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4z"/>
        </svg>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M2 22h20V2z"/>
        </svg>
        <div style="display: flex; align-items: center; gap: 1px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#ffffff">
            <path d="M17 5v14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h1V2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1h1a2 2 0 0 1 2 2z"/>
          </svg>
          <span style="font-size: 11px; margin-left: -2px;">13</span>
        </div>
      </div>
    </div>

    <!-- 2. TOP HEADER -->
    <div class="top-header">
      <a href="cuenta.html" class="back-btn" title="Volver">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>

      <h1 class="header-title">Crear cuenta</h1>

      <span class="step-badge">1 de 2</span>
    </div>

    <!-- 3. WHITE SHEET CONTENT -->
    <div class="sheet-body no-scrollbar">

      <p class="subtitle-text">
        Entrá a ver propiedades. Para publicar vas a necesitar verificar tu identidad, y eso lo hacés cuando quieras.
      </p>

      <!-- Google Button -->
      <button type="button" class="social-btn" onclick="handleRegister()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continuar con Google</span>
      </button>

      <!-- Apple Button -->
      <button type="button" class="social-btn" onclick="handleRegister()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#000000">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.66-.82 1.11-1.96.99-3.1-.96.04-2.12.65-2.8 1.45-.6.69-1.12 1.83-.98 2.94 1.07.08 2.15-.55 2.79-1.29z"/>
        </svg>
        <span>Continuar con Apple</span>
      </button>

      <!-- Divider -->
      <div class="divider-row">
        <div class="divider-line"></div>
        <span class="divider-text">o</span>
      </div>

      <!-- 1. Nombre completo -->
      <div class="form-group">
        <label class="form-label">Nombre completo</label>
        <input type="text" id="name-input" class="input-field" placeholder="Juan Pérez">
      </div>

      <!-- 2. Correo electrónico -->
      <div class="form-group">
        <label class="form-label">Correo electrónico</label>
        <input type="email" id="email-input" class="input-field" placeholder="ejemplo@correo.com">
      </div>

      <!-- 3. Teléfono -->
      <div class="form-group">
        <label class="form-label">Teléfono</label>
        <input type="tel" id="phone-input" class="input-field" placeholder="0412-123-4567">
      </div>

      <!-- 4. Estado -->
      <div class="form-group">
        <label class="form-label">Estado</label>
        <div class="dropdown-field">
          <span>Seleccionar Estado</span>
          <svg width="10" height="6" viewBox="0 0 10 6" fill="#64748b"><path d="M0 0l5 6 5-6z"/></svg>
        </div>
      </div>

      <!-- 5. Contraseña -->
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="pass-1" class="password-input" placeholder="Mínimo 6 caracteres">
          <button type="button" class="eye-btn" onclick="togglePass('pass-1')" title="Ver contraseña">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 6. Confirmar contraseña -->
      <div class="form-group">
        <label class="form-label">Confirmar contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="pass-2" class="password-input" placeholder="Repite tu contraseña">
          <button type="button" class="eye-btn" onclick="togglePass('pass-2')" title="Ver contraseña">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Forgot Password link -->
      <a href="#" class="forgot-pass-link">¿Olvidaste tu contraseña?</a>

    </div>

    <!-- 4. STICKY BOTTOM ACTION BAR -->
    <div class="bottom-action-bar">
      <button type="button" class="btn-submit" onclick="handleRegister()">
        Siguiente
      </button>
      <div class="android-indicator"></div>
    </div>

  </div>

  <script>
    function togglePass(id) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }

    function handleRegister() {
      // Register / Create account -> sets session to roger and redirects to profile
      localStorage.setItem('enkapta_session', 'roger');
      window.location.href = 'cuenta.html?auth=true';
    }

    // Scroll query param support for testing
    if (new URLSearchParams(window.location.search).get('scroll') === 'down') {
      setTimeout(() => {
        const body = document.querySelector('.sheet-body');
        if (body) body.scrollTop = 500;
      }, 150);
    }
  </script>

</body>
</html>
